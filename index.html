<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantry — Smart Spend Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0e0f0c;
    --surface: #161713;
    --card: #1c1e19;
    --border: #2a2c26;
    --accent: #b8f04a;
    --accent2: #f0c93a;
    --accent3: #4af0b8;
    --text: #e8e9e2;
    --muted: #7a7d6f;
    --danger: #f05a4a;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; overflow-x:hidden; }

  body::before {
    content:''; position:fixed; inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none; z-index:1000; opacity:0.4;
  }

  .app { display:flex; min-height:100vh; }

  /* SIDEBAR */
  .sidebar {
    width:220px; background:var(--surface); border-right:1px solid var(--border);
    padding:28px 20px; display:flex; flex-direction:column; gap:8px;
    position:sticky; top:0; height:100vh; flex-shrink:0;
  }
  .logo { font-family:'Playfair Display',serif; font-size:24px; font-weight:900; color:var(--accent); letter-spacing:-0.5px; margin-bottom:28px; }
  .nav-item {
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
    cursor:pointer; font-size:14px; font-weight:500; color:var(--muted); transition:all 0.2s; border:1px solid transparent;
  }
  .nav-item:hover { color:var(--text); background:var(--card); }
  .nav-item.active { color:var(--accent); background:rgba(184,240,74,0.08); border-color:rgba(184,240,74,0.2); }
  .sidebar-spacer { flex:1; }

  /* MAIN */
  .main { flex:1; padding:36px 40px; overflow-y:auto; }

  /* HEADER */
  .page-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:36px; }
  .page-title { font-family:'Playfair Display',serif; font-size:36px; font-weight:700; line-height:1.1; }
  .page-sub { color:var(--muted); font-size:14px; margin-top:4px; }

  /* BUTTONS */
  .btn { padding:10px 18px; border-radius:8px; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; transition:all 0.2s; }
  .btn-primary { background:var(--accent); color:#0e0f0c; }
  .btn-primary:hover { background:#ceff5a; transform:translateY(-1px); }
  .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); }
  .btn-ghost:hover { color:var(--text); border-color:var(--muted); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none !important; }

  /* UPLOAD ZONE */
  .upload-zone {
    border:2px dashed var(--border); border-radius:16px; padding:48px; text-align:center;
    cursor:pointer; transition:all 0.3s; background:var(--surface); position:relative; overflow:hidden; margin-bottom:32px;
  }
  .upload-zone::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 0%,rgba(184,240,74,0.04) 0%,transparent 70%); }
  .upload-zone:hover, .upload-zone.dragover { border-color:var(--accent); background:rgba(184,240,74,0.04); }
  .upload-icon { font-size:40px; margin-bottom:12px; }
  .upload-title { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; margin-bottom:8px; }
  .upload-sub { color:var(--muted); font-size:14px; }
  .upload-sub strong { color:var(--accent); }
  #fileInput { display:none; }

  /* STATS */
  .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:32px; }
  .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; position:relative; overflow:hidden; transition:transform 0.2s; }
  .stat-card:hover { transform:translateY(-2px); }
  .stat-card::after { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
  .stat-card.green::after { background:var(--accent); }
  .stat-card.yellow::after { background:var(--accent2); }
  .stat-card.blue::after { background:var(--accent3); }
  .stat-card.red::after { background:var(--danger); }
  .stat-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted); margin-bottom:8px; }
  .stat-value { font-family:'DM Mono',monospace; font-size:28px; font-weight:500; color:var(--text); }
  .stat-change { font-size:12px; color:var(--muted); margin-top:6px; }

  /* CHARTS */
  .charts-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:32px; }
  .chart-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; }
  .chart-title { font-family:'Playfair Display',serif; font-size:16px; font-weight:700; margin-bottom:6px; }
  .chart-sub { font-size:12px; color:var(--muted); margin-bottom:20px; }

  .bar-chart { display:flex; flex-direction:column; gap:10px; }
  .bar-row { display:flex; align-items:center; gap:10px; }
  .bar-label { font-size:12px; color:var(--muted); width:100px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track { flex:1; height:8px; background:var(--border); border-radius:99px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:99px; transition:width 1s cubic-bezier(0.16,1,0.3,1); }
  .bar-amt { font-family:'DM Mono',monospace; font-size:12px; color:var(--text); width:52px; text-align:right; flex-shrink:0; }

  .weekly-bars { display:flex; align-items:flex-end; gap:8px; height:100px; margin-top:16px; }
  .week-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .week-bar { width:100%; border-radius:4px 4px 0 0; background:var(--border); position:relative; overflow:hidden; }
  .week-bar-fill { position:absolute; bottom:0; left:0; right:0; border-radius:4px 4px 0 0; background:var(--accent); opacity:0.8; }
  .week-bar.current .week-bar-fill { opacity:1; }
  .week-label { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; }
  .week-amt { font-size:10px; color:var(--text); font-family:'DM Mono',monospace; }

  /* TABLE */
  .table-card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:32px; }
  .table-header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .table-title { font-family:'Playfair Display',serif; font-size:16px; font-weight:700; }
  .filter-pills { display:flex; gap:6px; flex-wrap:wrap; }
  .pill { padding:5px 12px; border-radius:99px; font-size:11px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--muted); transition:all 0.2s; text-transform:uppercase; letter-spacing:0.5px; }
  .pill:hover { color:var(--text); }
  .pill.active { background:rgba(184,240,74,0.12); color:var(--accent); border-color:rgba(184,240,74,0.3); }
  table { width:100%; border-collapse:collapse; }
  thead th { padding:12px 24px; text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted); border-bottom:1px solid var(--border); background:var(--surface); }
  tbody tr { border-bottom:1px solid rgba(42,44,38,0.6); transition:background 0.15s; }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:rgba(255,255,255,0.02); }
  td { padding:14px 24px; font-size:14px; }
  .td-item { font-weight:500; }
  .td-store,.td-date { color:var(--muted); font-size:13px; }
  .td-date { font-family:'DM Mono',monospace; }
  .td-price { font-family:'DM Mono',monospace; font-weight:500; text-align:right; }
  .cat-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:600; }
  .receipt-thumb { width:32px; height:32px; border-radius:6px; object-fit:cover; border:1px solid var(--border); cursor:pointer; }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:100; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.3s; }
  .modal-overlay.visible { opacity:1; pointer-events:all; }
  .modal { background:var(--card); border:1px solid var(--border); border-radius:20px; width:560px; max-width:95vw; padding:32px; transform:translateY(20px); transition:transform 0.3s; max-height:85vh; overflow-y:auto; }
  .modal-overlay.visible .modal { transform:translateY(0); }
  .modal-title { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; margin-bottom:6px; }
  .modal-sub { color:var(--muted); font-size:14px; margin-bottom:24px; }

  .scanning-anim { display:flex; flex-direction:column; align-items:center; padding:32px; gap:16px; }
  .scan-icon { font-size:48px; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.1);opacity:0.7} }
  .scan-line { width:200px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; position:relative; }
  .scan-progress { height:100%; background:var(--accent); border-radius:2px; transition:width 0.3s; width:0%; }
  .scan-status { color:var(--muted); font-size:14px; font-family:'DM Mono',monospace; }

  .receipt-items { display:flex; flex-direction:column; gap:10px; }
  .receipt-item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface); border-radius:10px; border:1px solid var(--border); animation:slideIn 0.3s ease both; }
  @keyframes slideIn { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
  .ri-name { flex:1; font-weight:500; font-size:14px; }
  .ri-cat select { background:var(--card); border:1px solid var(--border); color:var(--text); font-family:'DM Sans',sans-serif; font-size:12px; padding:4px 8px; border-radius:6px; cursor:pointer; }
  .ri-price { font-family:'DM Mono',monospace; font-size:14px; font-weight:500; width:60px; text-align:right; }
  .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding-top:20px; border-top:1px solid var(--border); }

  /* RECEIPT VIEWER */
  .receipt-viewer img { width:100%; border-radius:10px; }

  /* LOADING */
  .loading { display:flex; align-items:center; justify-content:center; padding:60px; color:var(--muted); gap:12px; font-size:14px; }
  .spinner { width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* EMPTY */
  .empty { text-align:center; padding:48px; color:var(--muted); }
  .empty-icon { font-size:32px; margin-bottom:12px; }
  .empty-text { font-size:14px; }

  /* TOAST */
  .toast { position:fixed; bottom:24px; right:24px; background:var(--accent); color:#0e0f0c; padding:14px 20px; border-radius:10px; font-weight:600; font-size:14px; z-index:200; transform:translateY(60px); opacity:0; transition:all 0.4s cubic-bezier(0.16,1,0.3,1); }
  .toast.show { transform:translateY(0); opacity:1; }
  .toast.error { background:var(--danger); color:#fff; }

  /* MANUAL FORM */
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  .form-group.full { grid-column:1/-1; }
  label { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
  input, select { background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; padding:10px 12px; border-radius:8px; width:100%; transition:border-color 0.2s; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }

  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  @media (max-width:900px) {
    .sidebar { width:60px; }
    .nav-item span:not(.nav-icon) { display:none; }
    .logo { font-size:0; }
    .logo::before { content:'🌿'; font-size:20px; }
    .nav-item { justify-content:center; }
    .stats-grid { grid-template-columns:1fr 1fr; }
    .charts-row { grid-template-columns:1fr; }
    .main { padding:24px 16px; }
    .form-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">🌿 pantry</div>
    <div class="nav-item active" data-view="dashboard">
      <span class="nav-icon">📊</span><span>Dashboard</span>
    </div>
    <div class="nav-item" data-view="items">
      <span class="nav-icon">🧾</span><span>All Items</span>
    </div>
    <div class="nav-item" data-view="upload">
      <span class="nav-icon">⬆️</span><span>Upload Bill</span>
    </div>
    <div class="nav-item" data-view="manual">
      <span class="nav-icon">✏️</span><span>Add Manually</span>
    </div>
    <div class="sidebar-spacer"></div>
    <div style="padding:12px;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace" id="dbStatus">⚪ connecting...</div>
  </aside>
  <main class="main" id="mainContent"></main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*,.pdf" />

<script>
// ── SUPABASE ──────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://yvmrnupcnhcxsmahyxka.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl2bXJudXBjbmhjeHNtYWh5eGthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTI1NjIsImV4cCI6MjA5NDM2ODU2Mn0.rFZSvliNEAAFCbLdkoQ86Vhjp6zRwNo7ftAwAvx6W7o';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── STATE ─────────────────────────────────────────────────────────────────
let currentView = 'dashboard';
let activeFilter = 'all';
let items = [];

const CATEGORIES = {
  produce:   { label:'Produce',   color:'#b8f04a', emoji:'🥦' },
  dairy:     { label:'Dairy',     color:'#f0c93a', emoji:'🥛' },
  meat:      { label:'Meat',      color:'#f05a4a', emoji:'🥩' },
  bakery:    { label:'Bakery',    color:'#f09a4a', emoji:'🍞' },
  drink:     { label:'Drinks',    color:'#4ab8f0', emoji:'💧' },
  frozen:    { label:'Frozen',    color:'#4af0b8', emoji:'🧊' },
  household: { label:'Household', color:'#f09a4a', emoji:'🏠' },
  snacks:    { label:'Snacks',    color:'#c44af0', emoji:'🍿' },
  other:     { label:'Other',     color:'#7a7d6f', emoji:'📦' },
};

// ── DB ────────────────────────────────────────────────────────────────────
async function loadItems() {
  const { data, error } = await sb.from('items').select('*').order('date', { ascending: false });
  if (error) { showToast('DB error: ' + error.message, true); return; }
  items = data || [];
  document.getElementById('dbStatus').textContent = '🟢 connected';
}

async function insertItems(newItems) {
  const { data, error } = await sb.from('items').insert(newItems).select();
  if (error) throw error;
  items = [...(data || []), ...items];
  return data;
}

async function uploadReceipt(file) {
  const ext = file.name.split('.').pop();
  const path = `receipts/${Date.now()}.${ext}`;
  const { error } = await sb.storage.from('receipts').upload(path, file, { contentType: file.type });
  if (error) throw error;
  const { data } = sb.storage.from('receipts').getPublicUrl(path);
  return data.publicUrl;
}

// ── UTILS ─────────────────────────────────────────────────────────────────
const fmt = n => '$' + Number(n).toFixed(2);
function catBadge(cat) {
  const c = CATEGORIES[cat] || CATEGORIES.other;
  return `<span class="cat-badge" style="background:${c.color}22;color:${c.color}">${c.emoji} ${c.label}</span>`;
}
function totalSpend() { return items.reduce((s,i) => s + i.price * i.qty, 0); }
function weeklySpend() {
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
  return items.filter(i => new Date(i.date) >= weekAgo).reduce((s,i) => s + i.price * i.qty, 0);
}
function catTotals() {
  const t = {};
  items.forEach(i => { t[i.category] = (t[i.category]||0) + i.price * i.qty; });
  return Object.entries(t).sort((a,b) => b[1]-a[1]);
}
function weeklyData() {
  const weeks = []; const data = [];
  for (let w = 5; w >= 0; w--) {
    const start = new Date(); start.setDate(start.getDate() - w*7 - 6);
    const end = new Date(); end.setDate(end.getDate() - w*7);
    const label = 'W'+(6-w);
    const total = items.filter(i => { const d = new Date(i.date); return d >= start && d <= end; }).reduce((s,i) => s + i.price*i.qty, 0);
    weeks.push(label); data.push(total);
  }
  return { weeks, data };
}
function topItems() {
  const t = {};
  items.forEach(i => {
    if (!t[i.name]) t[i.name] = { name:i.name, category:i.category, total:0, count:0 };
    t[i.name].total += i.price * i.qty;
    t[i.name].count += i.qty;
  });
  return Object.values(t).sort((a,b) => b.total - a.total);
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  const main = document.getElementById('mainContent');
  if (currentView === 'dashboard') main.innerHTML = renderDashboard();
  else if (currentView === 'items') main.innerHTML = renderItems();
  else if (currentView === 'upload') main.innerHTML = renderUpload();
  else if (currentView === 'manual') main.innerHTML = renderManual();
  bindEvents();
}

function renderDashboard() {
  const total = totalSpend(), weekly = weeklySpend();
  const cats = catTotals(), maxCat = cats[0]?.[1] || 1;
  const wData = weeklyData(), maxWeek = Math.max(...wData.data, 1);
  const stores = [...new Set(items.map(i=>i.store).filter(Boolean))];

  return `
  <div class="page-header">
    <div>
      <div class="page-title">Spending<br>Dashboard</div>
      <div class="page-sub">${items.length} items tracked · ${stores.length} stores</div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" onclick="setView('items')">View All Items</button>
      <button class="btn btn-primary" onclick="setView('upload')">+ Upload Bill</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card green">
      <div class="stat-label">This Week</div>
      <div class="stat-value">${fmt(weekly)}</div>
      <div class="stat-change">${items.filter(i=>{ const w=new Date(); w.setDate(w.getDate()-7); return new Date(i.date)>=w; }).length} items</div>
    </div>
    <div class="stat-card yellow">
      <div class="stat-label">All Time</div>
      <div class="stat-value">${fmt(total)}</div>
      <div class="stat-change">${items.length} items total</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-label">Top Category</div>
      <div class="stat-value" style="font-size:18px;margin-top:4px">${cats[0] ? (CATEGORIES[cats[0][0]]?.emoji+' '+CATEGORIES[cats[0][0]]?.label) : '—'}</div>
      <div class="stat-change">${cats[0] ? fmt(cats[0][1]) : ''}</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">Avg Item Price</div>
      <div class="stat-value">${items.length ? fmt(total/items.length) : '$0.00'}</div>
      <div class="stat-change">per line item</div>
    </div>
  </div>

  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-title">Spend by Category</div>
      <div class="chart-sub">All time totals</div>
      <div class="bar-chart">
        ${cats.length === 0 ? '<div style="color:var(--muted);font-size:13px">No data yet — upload a bill!</div>' :
          cats.slice(0,6).map(([cat,amt]) => {
            const c = CATEGORIES[cat]||CATEGORIES.other;
            const pct = (amt/maxCat*100).toFixed(1);
            return `<div class="bar-row">
              <div class="bar-label">${c.emoji} ${c.label}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${c.color}"></div></div>
              <div class="bar-amt">${fmt(amt)}</div>
            </div>`;
          }).join('')}
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title">Weekly Spending</div>
      <div class="chart-sub">Last 6 weeks</div>
      <div class="weekly-bars">
        ${wData.weeks.map((w,i) => {
          const h = Math.round((wData.data[i]/maxWeek)*80);
          return `<div class="week-col">
            <div class="week-amt">${wData.data[i]>0?'$'+Math.round(wData.data[i]):''}</div>

    <div class="table-header"><div class="table-title">Top Items by Spend</div></div>

}

// ── EVENTS ────────────────────────────────────────────────────────────────
function bindEvents() {
  const zone = document.getElementById('uploadZone');
  if (zone) {
    zone.ondragover = e => { e.preventDefault(); zone.classList.add('dragover'); };
    zone.ondragleave = () => zone.classList.remove('dragover');
    zone.ondrop = e => { e.preventDefault(); zone.classList.remove('dragover'); if(e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); };
  }
  document.getElementById('fileInput').onchange = e => { if(e.target.files[0]) processFile(e.target.files[0]); e.target.value=''; };
  document.querySelectorAll('.nav-item[data-view]').forEach(n => {
    n.onclick = () => setView(n.dataset.view);
  });
}

function setView(v) {
  currentView = v;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === v));
  render();
}

function setFilter(f) { activeFilter = f; render(); }

// ── MANUAL SAVE ───────────────────────────────────────────────────────────
async function saveManual() {
  const name = document.getElementById('m_name').value.trim();
  const price = parseFloat(document.getElementById('m_price').value);
  const qty = parseInt(document.getElementById('m_qty').value) || 1;
  const category = document.getElementById('m_cat').value;
  const store = document.getElementById('m_store').value.trim();
  const date = document.getElementById('m_date').value;

  if (!name || isNaN(price) || price <= 0) { showToast('Please fill in name and price', true); return; }

  const btn = document.getElementById('saveManualBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    await insertItems([{ name, price, qty, category, store: store||null, date, receipt_url: null }]);
    showToast('✅ Item saved!');
    setView('dashboard');
  } catch(e) {
    showToast('Error: ' + e.message, true);
    btn.disabled = false; btn.textContent = 'Save Item';
  }
}

// ── AI SCANNING ───────────────────────────────────────────────────────────
async function processFile(file) {
  showScanModal(file.name);

  // Upload receipt image to Supabase Storage
  let receiptUrl = null;
  try {
    updateScanProgress(15, 'Uploading receipt...');
    receiptUrl = await uploadReceipt(file);
  } catch(e) {
    console.warn('Receipt upload failed:', e.message);
  }

  // Convert to base64 for Claude
  const base64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });

  updateScanProgress(40, 'Sending to AI...');

  const isImage = file.type.startsWith('image/');
  const mediaType = isImage ? file.type : 'application/pdf';

  const contentBlock = isImage
    ? { type:'image', source:{ type:'base64', media_type:mediaType, data:base64 } }
    : { type:'document', source:{ type:'base64', media_type:'application/pdf', data:base64 } };

  try {
    updateScanProgress(60, 'Extracting items with AI...');

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            contentBlock,
            {
              type: 'text',
              text: `You are a receipt scanner. Extract all purchased items from this receipt.
Return ONLY a valid JSON array, no markdown, no explanation:
[{"name":"Item Name","price":0.00,"qty":1,"category":"produce|dairy|meat|bakery|drink|frozen|household|snacks|other","store":"Store Name"}]

Rules:
- name: clean product name
- price: unit price as number
- qty: quantity as integer  
- category: best match from the list
- store: store name from receipt, else "Unknown"
- Skip taxes, totals, subtotals, fees, discounts`
            }
          ]
        }]
      })
    });

    updateScanProgress(85, 'Processing results...');
    const data = await response.json();
    const text = data.content.map(b => b.text||'').join('');
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);

    updateScanProgress(100, 'Done!');
    setTimeout(() => showReviewModal(parsed, receiptUrl), 400);

  } catch(err) {
    updateScanProgress(100, 'Done!');
    // Demo fallback
    const demo = [
      { name:'Tomatoes', price:2.49, qty:2, category:'produce', store:'Unknown' },
      { name:'Whole Milk', price:3.99, qty:1, category:'dairy', store:'Unknown' },
      { name:'Bread', price:2.79, qty:1, category:'bakery', store:'Unknown' },
    ];
    setTimeout(() => showReviewModal(demo, receiptUrl), 400);
  }
}

// ── MODALS ────────────────────────────────────────────────────────────────
function showModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('visible');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('visible');
}

function showScanModal(filename) {
  showModal(`
    <div class="modal-title">Scanning Receipt</div>
    <div class="modal-sub">${filename}</div>
    <div class="scanning-anim">
      <div class="scan-icon">🔍</div>
      <div class="scan-line"><div class="scan-progress" id="scanProgress"></div></div>
      <div class="scan-status" id="scanStatus">Reading file...</div>
    </div>
  `);
}

function updateScanProgress(pct, msg) {
  const bar = document.getElementById('scanProgress');
  const status = document.getElementById('scanStatus');
  if (bar) bar.style.width = pct + '%';
  if (status) status.textContent = msg;
}

function showReviewModal(parsedItems, receiptUrl) {
  const cats = Object.keys(CATEGORIES);
  showModal(`
    <div class="modal-title">Review Items</div>
    <div class="modal-sub">${parsedItems.length} items found — adjust categories if needed</div>
    <div class="receipt-items">
      ${parsedItems.map((item,i) => `
      <div class="receipt-item" style="animation-delay:${i*0.05}s">
        <div class="ri-name">${item.name}
          <div style="font-size:11px;color:var(--muted)">${item.qty>1?item.qty+'× @ '+fmt(item.price):''}</div>
        </div>
        <div class="ri-cat">
          <select id="cat_${i}">
            ${cats.map(c=>`<option value="${c}" ${c===item.category?'selected':''}>${CATEGORIES[c].emoji} ${CATEGORIES[c].label}</option>`).join('')}
          </select>
        </div>
        <div class="ri-price">${fmt(item.price*item.qty)}</div>
      </div>`).join('')}
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveReceiptBtn" onclick="saveReceiptItems(${JSON.stringify(parsedItems).replace(/"/g,'&quot;')}, '${receiptUrl||''}')">
        💾 Save ${parsedItems.length} Items to Database
      </button>
    </div>
  `);
}

async function saveReceiptItems(parsedItems, receiptUrl) {
  const btn = document.getElementById('saveReceiptBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  // Read updated categories
  parsedItems.forEach((item, i) => {
    const sel = document.getElementById(`cat_${i}`);
    if (sel) item.category = sel.value;
  });

  const today = new Date().toISOString().split('T')[0];
  const rows = parsedItems.map(item => ({
    name: item.name,
    category: item.category,
    price: item.price,
    qty: item.qty || 1,
    store: item.store || null,
    date: today,
    receipt_url: receiptUrl || null,
  }));

  try {
    await insertItems(rows);
    closeModal();
    showToast(`✅ ${rows.length} items saved to database!`);
    setView('dashboard');
  } catch(e) {
    showToast('Save failed: ' + e.message, true);
    btn.disabled = false; btn.textContent = 'Retry';
  }
}

function viewReceipt(url) {
  showModal(`
    <div class="modal-title">Receipt</div>
    <div class="modal-sub" style="margin-bottom:16px">Stored in your Supabase bucket</div>
    <div class="receipt-viewer">
      <img src="${url}" onerror="this.style.display='none';document.getElementById('pdfLink').style.display='block'" />
      <a id="pdfLink" href="${url}" target="_blank" style="display:none;color:var(--accent)">Open receipt file ↗</a>
    </div>
    <div class="modal-footer">
      <a href="${url}" target="_blank" class="btn btn-ghost">Open Full Size ↗</a>
      <button class="btn btn-primary" onclick="closeModal()">Close</button>
    </div>
  `);
}

// ── TOAST ─────────────────────────────────────────────────────────────────
function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError?' error':'');
  setTimeout(() => t.className = 'toast', 3500);
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

// ── INIT ──────────────────────────────────────────────────────────────────
(async () => {
  render(); // Show UI immediately with loading state
  document.getElementById('mainContent').innerHTML = `<div class="loading"><div class="spinner"></div> Loading your data...</div>`;
  await loadItems();
  render();
  bindEvents();
})();
</script>
